server:
  port: 8081

spring:
  application:

    name: Meeting_Notes_Summariser
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5433/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified
    username: postgres
    password: postgres

  ai:
#    model:
#      chat: google-genai
#      embedding: ollama


    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1024
        max-document-batch-size: 10000

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL}
      chat:
        options:
          model: ${GROQ_MODEL}
          temperature: 0.7

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite   # alternatives: gemma-4-31b-it, gemini-3.8-flash
            temperature: 0.7


#    ollama:
#      base-url: http://localhost:11434
#      embedding:
#        options:
#          model: mxbai-embed-large

logging:
  level:
    root: INFO
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG